name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag, for example v0.1.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release-version.outputs.value }}
      sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read

    steps:
      - name: Resolve release version
        id: release-version
        shell: bash
        env:
          WORKFLOW_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${WORKFLOW_VERSION:-$GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected an existing stable version tag such as v0.1.2' >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release-version.outputs.value }}

      - name: Pin source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Configure TAURI_SIGNING_PRIVATE_KEY before building candidates' >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pandoc

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.value }}
        run: pnpm run release:check -- --release-version "$RELEASE_VERSION"
      - run: pnpm run ci
      - name: Verify actual Word export
        run: cargo test --manifest-path src-tauri/Cargo.toml actual_pandoc_exports_daily_formal_and_custom_with_page_geometry -- --ignored
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-test-results
          path: test-results/
          retention-days: 7

  prepare-draft:
    name: Prepare candidate draft
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Create or reuse unpublished draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            jq -e '.isDraft == true' release.json > /dev/null || {
              echo 'Refusing to overwrite an already published release' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "MarkDoc $RELEASE_TAG" --notes 'Candidate installers with signed updater artifacts. Native acceptance pending.'
          fi
          ID=$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  publish:
    name: Build ${{ matrix.name }}
    needs: [preflight, prepare-draft]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: pnpm run release:check -- --release-version "$RELEASE_VERSION"

      - uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: '-'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-draft.outputs.release-id }}
          tagName: ${{ needs.preflight.outputs.version }}
          releaseName: MarkDoc ${{ needs.preflight.outputs.version }}
          releaseBody: Candidate installers with signed updater artifacts. Native acceptance pending.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  verify-candidate:
    name: Verify candidate assets (keep draft)
    needs:
      - preflight
      - publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify updater manifest and attachments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.version }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,tagName,assets > "$RUNNER_TEMP/release.json"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/candidate"
          node scripts/validate-release-assets.mjs "$RUNNER_TEMP/candidate/latest.json" "$RUNNER_TEMP/release.json" "$RELEASE_TAG" "$GH_REPO"
          echo 'Candidate build verified. Release remains a draft pending native acceptance.' >> "$GITHUB_STEP_SUMMARY"
