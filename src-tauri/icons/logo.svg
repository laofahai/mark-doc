<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- 顶部高光：玻璃质感 -->
    <linearGradient id="gloss" x1="256" y1="0" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.25"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- 文字投影 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg_grad)"/>

  <!-- 玻璃高光层 -->
  <rect width="512" height="300" rx="112" fill="url(#gloss)"/>

  <!-- 一笔 MD（带投影） -->
  <path
    d="M 80,388
       L 80,124
       L 190,268
       L 300,124
       C 348,72 440,148 440,256
       C 440,364 348,404 280,388"
    stroke="white"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#shadow)"
  />
</svg>
